[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-query"
version = "0.4.0"
description = "A typed SQLite analytics application with CLI and optional HTTP API interfaces."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "uvicorn==0.52.3",
]
keywords = ["cli", "api", "sqlite", "analytics", "data-processing", "reporting"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/saurabho7222/data-query"
Repository = "https://github.com/saurabho7222/data-query"
Issues = "https://github.com/saurabho7222/data-query/issues"
Documentation = "https://github.com/saurabho7222/data-query#readme"

[project.scripts]
data-query = "data_query.cli:main"
data-query-api = "data_query.api:main"

[tool.data-query]
project_type = "application"
category = "application"
domain = "data-processing"
runtime = "python"
database = "embedded-sqlite"
primary_interface = "command-line"
interfaces = ["command-line", "http-api"]
infrastructure_as_code = false
service = true
self_contained = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.coverage.run]
source = ["data_query"]
omit = ["src/data_query/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 130
src = ["src", "tests", "examples", "scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/data_query", "examples", "scripts"]
strict = true
pretty = true
show_error_codes = true
