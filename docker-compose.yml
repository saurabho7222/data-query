services:
  sample-db:
    build:
      context: .
    command: ["python3", "examples/create_sample_db.py", "/data/input.db"]
    volumes:
      - ./.local:/data

  report:
    build:
      context: .
    depends_on:
      sample-db:
        condition: service_completed_successfully
    command:
      - data-query
      - --input
      - /data/input.db
      - --output
      - /data/report.json
      - --customers-csv
      - /data/customers.csv
      - --monthly-csv
      - /data/monthly.csv
      - --log-level
      - INFO
    volumes:
      - ./.local:/data

  api:
    build:
      context: .
    depends_on:
      sample-db:
        condition: service_completed_successfully
    command: ["data-query-api"]
    environment:
      DATA_QUERY_DATA_ROOT: /data
      DATA_QUERY_HOST: 0.0.0.0
      DATA_QUERY_PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./.local:/data:ro
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()"
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
