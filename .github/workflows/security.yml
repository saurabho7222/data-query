name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned audit tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Audit locked runtime dependency graph
        run: python -m pip_audit . --locked
      - name: Audit pinned development dependencies
        run: python -m pip_audit --no-deps -r requirements-dev.txt

  dependency-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify direct runtime and development dependency pins are current
        run: python scripts/check_dependency_freshness.py | tee dependency-freshness.txt
      - name: Upload dependency freshness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-freshness-${{ github.sha }}
          path: dependency-freshness.txt
          if-no-files-found: error

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
