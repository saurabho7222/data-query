name: Refresh runtime lock

on:
  push:
    branches:
      - score-hardening-v4

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: score-hardening-v4
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.12.0"
      - name: Generate and verify uv.lock
        run: |
          uv lock
          uv lock --check
      - name: Commit generated lock when changed
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "Refresh runtime dependency lock"
          git push origin HEAD:score-hardening-v4
