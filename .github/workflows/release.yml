name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "pyproject.toml"
      - "CHANGELOG.md"
      - "src/**"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Resolve release version
        id: release_meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          else
            version="$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
            tag="v${version}"
          fi
          grep -F "## [${version}]" CHANGELOG.md >/dev/null
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]] && git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build wheel from release source
        if: steps.release_meta.outputs.skip != 'true'
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Verify release wheel in a clean environment
        if: steps.release_meta.outputs.skip != 'true'
        run: |
          python -m venv /tmp/data-query-release-check
          /tmp/data-query-release-check/bin/python -m pip install dist/*.whl
          /tmp/data-query-release-check/bin/data-query --help
      - name: Create version tag from main
        if: steps.release_meta.outputs.skip != 'true' && github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
      - name: Publish verified GitHub release
        if: steps.release_meta.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" dist/*.whl --verify-tag --generate-notes --title "$TAG"
          fi
