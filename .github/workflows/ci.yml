name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development tools
        run: |
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy src/data_query task/solution task/examples

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test tools
        run: |
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt
      - name: Run coverage-gated tests
        run: python -m pytest --cov=data_query --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - name: Verify compatibility test entry point
        run: sh task/tests/test.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t data-query .
      - name: Run tests inside image
        run: docker run --rm data-query sh task/tests/test.sh
