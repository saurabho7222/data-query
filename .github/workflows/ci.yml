name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked test dependencies
        run: python -m pip install --no-deps -r requirements.lock

      - name: Run project test command
        run: sh task/tests/test.sh

      - name: Run pytest directly
        run: python3 -m pytest task/tests/test_outputs.py -v

      - name: Build Docker image
        run: docker build -f task/environment/Dockerfile -t data-query .

      - name: Run tests inside Docker
        run: docker run --rm data-query sh task/tests/test.sh
