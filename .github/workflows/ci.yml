name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lint tooling
        run: python -m pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and type-check tooling
        run: |
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt
      - name: mypy strict
        run: mypy src/data_query examples scripts

  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test tooling
        run: |
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt
      - name: pytest coverage gate
        run: pytest --cov=data_query --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - name: Smoke-test installed CLI
        run: python -m data_query --help

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Build wheel from source
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Install wheel into clean virtual environment
        run: |
          python -m venv /tmp/data-query-package-check
          /tmp/data-query-package-check/bin/python -m pip install --no-deps dist/*.whl
      - name: Smoke-test packaged console script
        run: /tmp/data-query-package-check/bin/data-query --help

  docker:
    name: docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t data-query .
      - name: Run tests inside image
        run: docker run --rm data-query python3 -m pytest tests -v
      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet
      - name: Run self-contained Compose demo
        run: make compose-demo
