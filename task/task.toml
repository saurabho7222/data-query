artifacts = ["/app/output.json"]

[project]
name = "data-query"
description = "Validate SQLite sales data and generate deterministic analytics reports."

[metadata]
category = "Data Querying and Databases"
subcategory = "SQL querying"
task_objective = ["implement", "validate"]
artifact_type = ["application", "report"]
expert_time_estimate_hours = 2
difficulty_explanation = "Requires relational validation, aggregate SQL, deterministic ordering, filtering, and atomic output behavior."
solution_explanation = "Validate schema/data in read-only SQLite mode, apply consistent filters, aggregate completed-order revenue, then atomically serialize JSON/CSV outputs."
verification_explanation = "Root pytest suite uses isolated SQLite fixtures to verify aggregates, filters, exports, invalid inputs, and sample generation."

[verifier]
timeout_sec = 120.0

[runner]
timeout_sec = 120.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = false
mcp_servers = []
